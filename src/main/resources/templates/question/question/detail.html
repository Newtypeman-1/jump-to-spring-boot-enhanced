<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{global/layout}">
<head>
    <title th:text="${question.subject}">질문 상세</title>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container my-3">
        <!-- 질문 -->
        <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
        <div class="card my-3">
            <div class="card-body">
                <div class="card-text" th:utext="${markdown.render(question.content)}"></div>
                <div class="d-flex justify-content-end">
                    <div th:if="${question.modified}" class="badge bg-light text-dark p-2 text-start mx-3">
                        <div class="mb-2">modified at</div>
                        <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div class="badge bg-light text-dark p-2 text-start">
                        <div class="mb-2">
                            <span th:if="${question.author != null}" th:text="${question.author.username}"></span>
                        </div>
                        <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                </div>
                <div class="my-3">
                    <form th:action="@{|/question/vote/${question.id}|}" method="post" class="d-inline"
                          onsubmit="return confirm('정말로 추천하시겠습니까?');">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">
                            추천
                            <span class="badge rounded-pill bg-success" th:text="${question.voter.size()}"></span>
                        </button>
                    </form>
                </div>
                <div class="my-3" sec:authorize="isAuthenticated()"
                     th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}">
                    <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                    <form th:action="@{|/question/delete/${question.id}|}" method="post" class="d-inline"
                          onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 답변 개수 -->
        <h5 class="border-bottom my-3 py-2" th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>

        <!-- 답변 목록 -->
        <div class="card my-3" th:each="answer : ${question.answerList}">
        <a th:id="|answer_${answer.id}|"></a>
            <div class="card-body">
                <div class="card-text" th:utext="${markdown.render(answer.content)}"></div>
                <div class="d-flex justify-content-end">
                    <div th:if="${answer.modified}" class="badge bg-light text-dark p-2 text-start mx-3">
                        <div class="mb-2">modified at</div>
                        <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div class="badge bg-light text-dark p-2 text-start">
                        <div class="mb-2">
                            <span th:if="${answer.author != null}" th:text="${answer.author.username}"></span>
                        </div>
                        <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                </div>
                <div class="my-3">
                    <form th:action="@{|/answer/vote/${answer.id}|}" method="post" class="d-inline"
                          onsubmit="return confirm('정말로 추천하시겠습니까?');">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">
                            추천
                            <span class="badge rounded-pill bg-success" th:text="${answer.voter.size()}"></span>
                        </button>
                    </form>
                </div>
                <div class="my-3" sec:authorize="isAuthenticated()"
                     th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}">
                    <a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-sm btn-outline-secondary">수정</a>
                    <form th:action="@{|/answer/delete/${answer.id}|}" method="post" class="d-inline"
                          onsubmit="return confirm('정말로 삭제하시겠습니까?');">
                        <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 답변 작성 -->
        <form th:action="@{|/answer/create/${question.id}|}" th:object="${form}" method="post" class="my-3">
            <th:block th:replace="~{global/fragments/form_errors :: formErrorsFragment}"></th:block>
            <textarea sec:authorize="isAnonymous()" disabled th:field="*{content}" class="form-control" rows="10"></textarea>
            <textarea sec:authorize="isAuthenticated()" th:field="*{content}" rows="10" class="form-control"></textarea>
            <input type="submit" value="답변등록" class="btn btn-primary my-2">
        </form>
    </div>
</th:block>
</body>
</html>
