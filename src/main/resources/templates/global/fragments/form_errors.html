<!--
  폼 검증 오류 출력
  - 메시지 형식: "순번-필드명-메시지" (예: 01-subject-제목은 필수항목입니다.)
  - 순번으로 정렬해 화면의 입력 순서대로 보여주고, 첫 오류 필드에 포커스
-->
<th:block th:fragment="formErrorsFragment" th:if="${#fields.hasAnyErrors()}"
          th:with="errors=${#lists.sort(#fields.allErrors())}">
    <div class="alert alert-danger" role="alert">
        <div th:each="err : ${errors}"
             th:text="${#strings.substringAfter(#strings.substringAfter(err, '-'), '-')}"></div>
    </div>
    <script th:inline="javascript">
        // 이 프래그먼트는 입력 필드보다 먼저 렌더링되므로 문서를 다 읽은 뒤 포커스
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById(/*[[${#strings.substringBefore(#strings.substringAfter(errors[0], '-'), '-')}]]*/ '')?.focus();
        });
    </script>
</th:block>
